name: ERP pilot checks
on:
  push:
    paths: ['apps/erp/**', 'infra/erp-compose.yml', '.github/workflows/erp-ci.yml']
  pull_request:
    paths: ['apps/erp/**', 'infra/erp-compose.yml', '.github/workflows/erp-ci.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: erp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp -d erp_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/erp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/erp/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://erp:ci-only-password@127.0.0.1:5432/erp_test
      - run: npm run typecheck
      - run: npm run build
      - run: node tests/http-smoke.mjs
      - run: docker build -t celerates-erp:ci .
