name: Render Mermaid diagrams

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/architecture/**/*.mmd'
      - '.github/workflows/render-diagrams.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mermaid CLI
        run: npm install --global @mermaid-js/mermaid-cli

      - name: Render SVG diagrams
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/architecture/rendered
          shopt -s nullglob
          files=(docs/architecture/*.mmd)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'No Mermaid sources found.'
            exit 1
          fi
          for src in "${files[@]}"; do
            base="$(basename "${src%.mmd}")"
            echo "Rendering $src -> docs/architecture/rendered/$base.svg"
            mmdc -i "$src" -o "docs/architecture/rendered/$base.svg" -b transparent
          done

      - name: Commit generated SVGs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/architecture/rendered; then
            echo 'Rendered diagrams are already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/architecture/rendered
          git commit -m 'docs: render Mermaid diagrams [skip ci]'
          git push
