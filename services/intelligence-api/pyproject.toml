[project]
name = "celerates-intelligence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.18,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "litellm>=1.80,<2",
  "boto3>=1.35,<2",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "cryptography>=46,<51",
  "ag-ui-protocol==1.0.0",
  "pypdf>=5,<7",
]
[project.optional-dependencies]
documents = ["docling>=2.60,<3"]
observability = ["langfuse>=3,<4"]
test = ["pytest>=8,<10", "ruff>=0.12,<1"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["cdi*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.ruff.lint.isort]
known-first-party = ["cdi"]
