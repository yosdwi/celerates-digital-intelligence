<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fa">
<title>Offline · Celerates</title>
<style>
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: #f4f6fa; color: #0e1726; font-family: "Plus Jakarta Sans", -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 320px; padding: 24px; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  img { width: 64px; height: 64px; border-radius: 18px; border: 1px solid #e5e9f0; background: #fff; }
  h1 { margin: 0; font-size: 22px; font-weight: 800; }
  p { margin: 0; font-size: 15px; line-height: 1.5; color: #566072; }
  button { margin-top: 6px; height: 50px; padding: 0 22px; border: 0; border-radius: 14px; background: #2356e8; color: #fff; font: inherit; font-weight: 700; font-size: 15px; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Anda sedang offline</h1>
  <p>Data ERP tidak disimpan di perangkat. Sambungkan kembali internet untuk melanjutkan.</p>
  <button type="button" onclick="location.reload()">Coba lagi</button>
</main>
</body>
</html>
